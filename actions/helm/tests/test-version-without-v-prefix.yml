name: Test version without v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Put expected helm tool dir on PATH (installer verifies helm via PATH)
        run: |
          OS=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          echo "${RUNNER_TOOL_CACHE}/helm/v3.13.3/${OS}/${ARCH}" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          version: 3.13.3
      - name: Assert helm version and normalized cache dir
        run: |
          ACTUAL="$(helm version --short)"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            v3.13.3*) ;;
            *) echo "FAIL: expected v3.13.3"; exit 1 ;;
          esac
          OS=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          P="${RUNNER_TOOL_CACHE}/helm/v3.13.3/${OS}/${ARCH}/helm"
          if [ ! -x "$P" ]; then
            echo "FAIL: expected normalized path $P"
            exit 1
          fi
          echo "PASS"
