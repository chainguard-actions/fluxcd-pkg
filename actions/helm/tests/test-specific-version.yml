name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v3.14.0
      - name: Assert helm installed with requested version
        run: |
          which helm
          ACTUAL="$(helm version --short)"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            v3.14.0*) echo "PASS" ;;
            *) echo "FAIL: expected v3.14.0"; exit 1 ;;
          esac
      - name: Assert binary placed in tool cache
        run: |
          OS=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          P="${RUNNER_TOOL_CACHE}/helm/v3.14.0/${OS}/${ARCH}/helm"
          echo "expected path: $P"
          if [ ! -x "$P" ]; then
            echo "FAIL: helm binary not found in tool cache"
            exit 1
          fi
          echo "PASS"
