name: Test cached reinstall
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The get-helm-3 installer requires `helm` on PATH after install; the act
      # image has no preinstalled helm, so pre-add the expected tool dir.
      - name: Pre-add expected tool dir to PATH
        run: |
          OS=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          echo "${RUNNER_TOOL_CACHE}/helm/v3.14.0/${OS}/${ARCH}" >> "$GITHUB_PATH"
      - id: first
        uses: .
        with:
          version: v3.14.0
      - name: Record binary mtime
        run: |
          OS=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          BIN="${RUNNER_TOOL_CACHE}/helm/v3.14.0/${OS}/${ARCH}/helm"
          stat -c %Y "$BIN" > /tmp/helm-mtime
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          sleep 2
      - id: second
        uses: .
        with:
          version: 3.14.0
      - name: Assert cached binary reused
        run: |
          BEFORE="$(cat /tmp/helm-mtime)"
          AFTER="$(stat -c %Y "$BIN")"
          echo "before: $BEFORE after: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: binary was re-downloaded"
            exit 1
          fi
          ACTUAL="$(helm version --template '{{.Version}}')"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "v3.14.0" ]; then
            echo "FAIL: expected v3.14.0"
            exit 1
          fi
          echo "PASS"
