name: Test cached reinstall
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-add helm tool dir to PATH (installer verifies helm is on PATH)
        run: |
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          D="${RUNNER_TOOL_CACHE}/helm/v3.14.0/linux/${ARCH}"
          mkdir -p "$D"
          echo "$D" >> "$GITHUB_PATH"
      - id: first
        uses: .
        with:
          version: v3.14.0
      - name: Record binary mtime
        run: |
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          F="${RUNNER_TOOL_CACHE}/helm/v3.14.0/linux/${ARCH}/helm"
          stat -c %Y "$F" > /tmp/helm-mtime
          cat /tmp/helm-mtime
      - id: second
        uses: .
        with:
          version: v3.14.0
      - name: Assert binary reused and still works
        run: |
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          F="${RUNNER_TOOL_CACHE}/helm/v3.14.0/linux/${ARCH}/helm"
          BEFORE="$(cat /tmp/helm-mtime)"
          AFTER="$(stat -c %Y "$F")"
          echo "before: $BEFORE after: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: binary was re-downloaded"
            exit 1
          fi
          ACTUAL="$(helm version --short)"
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            v3.14.0*) echo "PASS" ;;
            *) echo "FAIL: expected v3.14.0"; exit 1 ;;
          esac
