name: Test latest version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert yq installed and functional
        run: |
          OUT="$(yq --version)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE "version v?[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "FAIL: unexpected yq --version output"
            exit 1
          fi
          VAL="$(echo 'b: hello' | yq '.b')"
          echo "eval: $VAL"
          if [ "$VAL" != "hello" ]; then
            echo "FAIL: yq evaluation failed"
            exit 1
          fi
          echo "PASS"
