name: Test latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert yq installed from tool cache
        run: |
          echo "yq path: $(command -v yq)"
          OUT="$(yq --version)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -qE "version v?[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          case "$(command -v yq)" in
            "$RUNNER_TOOL_CACHE/yq/v"*) echo "PASS" ;;
            *) echo "FAIL: yq not resolved from tool cache"; exit 1 ;;
          esac
