name: Test second run is idempotent
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: first
        uses: .
        with:
          version: v4.44.3
      - name: Record install location
        id: loc
        run: |
          BIN="$(which yq)"
          echo "first install: $BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
      - id: second
        uses: .
        with:
          version: v4.44.3
      - name: Assert second run leaves a working install in the same location
        env:
          BIN: ${{ steps.loc.outputs.bin }}
        run: |
          NOW_BIN="$(which yq)"
          echo "before: $BIN after: $NOW_BIN"
          if [ "$NOW_BIN" != "$BIN" ]; then
            echo "FAIL: yq location changed between runs"
            exit 1
          fi
          case "$NOW_BIN" in
            "$RUNNER_TOOL_CACHE"/yq/v4.44.3/linux/*/yq) ;;
            *) echo "FAIL: unexpected yq path $NOW_BIN"; exit 1 ;;
          esac
          if [ ! -x "$NOW_BIN" ]; then
            echo "FAIL: yq not executable"
            exit 1
          fi
          OUT="$(yq --version)"
          echo "version: $OUT"
          echo "$OUT" | grep -q "v4.44.3" || { echo "FAIL: wrong version"; exit 1; }
          echo 'a: 1' | yq '.a' | grep -qx 1 || { echo "FAIL: yq does not work"; exit 1; }
          echo "PASS"
