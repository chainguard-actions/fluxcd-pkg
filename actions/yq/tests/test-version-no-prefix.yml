name: Test version without v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 4.44.3
      - name: Assert yq installed and v prefix added to tool dir
        run: |
          ACTUAL="$(yq --version)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "4.44.3"; then
            echo "FAIL: expected yq version 4.44.3"
            exit 1
          fi
          if [ ! -x "$RUNNER_TOOL_CACHE/yq/v4.44.3/linux/amd64/yq" ] && \
             [ ! -x "$RUNNER_TOOL_CACHE/yq/v4.44.3/linux/arm64/yq" ]; then
            echo "FAIL: expected binary under v-prefixed tool cache dir"
            ls -R "$RUNNER_TOOL_CACHE/yq" || true
            exit 1
          fi
          echo "PASS"
