name: Test missing CRD file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean output dir
        run: rm -rf "$GITHUB_WORKSPACE/schemas-missing"
      - id: action
        uses: .
        continue-on-error: true
        with:
          crd: tests/fixtures/does-not-exist.yaml
          output: schemas-missing
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing CRD file"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/schemas-missing" ]; then
            echo "FAIL: output dir should not be created"
            exit 1
          fi
          echo "PASS"
