name: Test basic single CRD
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean output dir
        run: rm -rf "$GITHUB_WORKSPACE/schemas-basic"
      - id: action
        uses: .
        with:
          crd: tests/fixtures/widget-crd.yaml
          output: schemas-basic
      - name: Assert schema files generated
        run: |
          OUT="$GITHUB_WORKSPACE/schemas-basic"
          ls -la "$OUT" || { echo "FAIL: output dir missing"; exit 1; }
          for f in widget-example-v1.json _definitions.json all.json; do
            if [ ! -s "$OUT/$f" ]; then
              echo "FAIL: missing $f"
              exit 1
            fi
          done
          echo "PASS: files present"
      - name: Assert schema content
        run: |
          OUT="$GITHUB_WORKSPACE/schemas-basic"
          python3 - "$OUT" <<'EOF'
          import json, sys, os
          out = sys.argv[1]
          s = json.load(open(os.path.join(out, "widget-example-v1.json")))
          print(json.dumps(s, indent=1))
          assert s["type"] == "object", "root type"
          assert s.get("additionalProperties") in (None, False), "root additionalProperties should be absent or False"
          assert s["properties"]["apiVersion"]["type"] == "string"
          assert s["properties"]["kind"]["type"] == "string"
          spec = s["properties"]["spec"]
          assert spec["properties"]["color"]["type"] == "string"
          assert spec["additionalProperties"] is False, "spec additionalProperties"
          assert spec["properties"]["size"]["type"] == "integer"
          assert spec["properties"]["port"] == {"oneOf": [{"type": "string"}, {"type": "integer"}]}, "int-or-string replaced"
          d = json.load(open(os.path.join(out, "_definitions.json")))
          key = "example.com.v1.Widget"
          assert key in d["definitions"], "definitions key"
          dd = d["definitions"][key]
          assert dd["properties"]["apiVersion"]["enum"] == ["example.com/v1"]
          assert dd["properties"]["kind"]["enum"] == ["Widget"]
          a = json.load(open(os.path.join(out, "all.json")))
          assert a == {"oneOf": [{"$ref": "_definitions.json#/definitions/example.com.v1.Widget"}]}, a
          print("PASS: content valid")
          EOF
