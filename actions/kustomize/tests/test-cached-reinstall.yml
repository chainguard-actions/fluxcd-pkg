name: Test second run uses tool cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: first
        uses: .
        with:
          version: "5.3.0"
      - id: second
        uses: .
        with:
          version: "5.3.0"
      - name: Assert kustomize still works
        run: |
          ACTUAL="$(kustomize version)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "5.3.0"; then
            echo "FAIL: expected version 5.3.0"
            exit 1
          fi
          echo "PASS"
