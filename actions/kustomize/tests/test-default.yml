name: Test default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert kustomize 5.3.0 installed
        run: |
          which kustomize
          ACTUAL="$(kustomize version)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "v5.3.0"; then
            echo "FAIL: expected v5.3.0"
            exit 1
          fi
          case "$(which kustomize)" in
            */kustomize/v5.3.0/linux/*) echo "PASS: path in tool cache" ;;
            *) echo "FAIL: unexpected path $(which kustomize)"; exit 1 ;;
          esac
          echo "PASS"
