name: Test latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # NOTE: kubernetes-sigs/kustomize release tags look like "kustomize/v5.8.3",
      # which the action turns into "vkustomize/v5.8.3", so the download can 404.
      # The 'latest' path depends on that external API, so either outcome is
      # accepted, but success must produce a working kustomize.
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: latest
      - name: Assert latest install outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            ACTUAL="$(kustomize version)"
            echo "actual: $ACTUAL"
            if ! echo "$ACTUAL" | grep -qE "v?[0-9]+\.[0-9]+\.[0-9]+"; then
              echo "FAIL: expected a semver version"
              exit 1
            fi
            echo "PASS: latest kustomize installed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed resolving 'latest' (upstream tag format kustomize/vX.Y.Z)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
