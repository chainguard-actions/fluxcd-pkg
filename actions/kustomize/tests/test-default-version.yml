name: Test default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert kustomize 5.3.0 installed
        run: |
          which kustomize || { echo "FAIL: kustomize not on PATH"; exit 1; }
          OUT="$(kustomize version)"
          echo "version: $OUT"
          if ! echo "$OUT" | grep -q "5.3.0"; then
            echo "FAIL: expected 5.3.0"
            exit 1
          fi
          case "$(which kustomize)" in
            *kustomize/v5.3.0/linux/*) echo "PASS: tool cache path ok" ;;
            *) echo "FAIL: unexpected path $(which kustomize)"; exit 1 ;;
          esac
