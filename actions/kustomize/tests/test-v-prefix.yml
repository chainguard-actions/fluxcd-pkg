name: Test version with v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "v5.2.1"
      - name: Assert kustomize 5.2.1 installed
        run: |
          ACTUAL="$(kustomize version)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "v5.2.1"; then
            echo "FAIL: expected v5.2.1"
            exit 1
          fi
          case "$(which kustomize)" in
            */kustomize/v5.2.1/*) echo "PASS: no double v prefix" ;;
            *) echo "FAIL: unexpected path $(which kustomize)"; exit 1 ;;
          esac
