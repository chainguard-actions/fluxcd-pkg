name: Test specific version without v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "5.4.1"
      - name: Assert kustomize 5.4.1 installed
        run: |
          ACTUAL="$(kustomize version)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "v5.4.1"; then
            echo "FAIL: expected v5.4.1"
            exit 1
          fi
          echo "PASS"
