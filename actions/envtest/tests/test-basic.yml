name: Test basic usage (defaults)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert setup-envtest is on PATH
        run: |
          if ! command -v setup-envtest >/dev/null 2>&1; then
            echo "FAIL: setup-envtest not found on PATH"
            exit 1
          fi
          echo "found: $(command -v setup-envtest)"
          echo "PASS"
      - name: Assert KUBEBUILDER_ASSETS is set and contains binaries
        run: |
          echo "raw KUBEBUILDER_ASSETS: $KUBEBUILDER_ASSETS"
          ASSETS="${KUBEBUILDER_ASSETS//\'/}"
          echo "assets: $ASSETS"
          if [ -z "$ASSETS" ]; then
            echo "FAIL: KUBEBUILDER_ASSETS is empty"
            exit 1
          fi
          if [ ! -d "$ASSETS" ]; then
            echo "FAIL: $ASSETS is not a directory"
            exit 1
          fi
          ls -la "$ASSETS"
          for b in kube-apiserver etcd kubectl; do
            if [ ! -x "$ASSETS/$b" ]; then
              echo "FAIL: missing binary $b"
              exit 1
            fi
          done
          echo "PASS"
