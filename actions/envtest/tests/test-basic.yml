name: Test basic usage (defaults)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert setup-envtest on PATH
        run: |
          if ! command -v setup-envtest >/dev/null 2>&1; then
            echo "FAIL: setup-envtest not on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          echo "PASS: $(command -v setup-envtest)"
      - name: Assert KUBEBUILDER_ASSETS contains envtest binaries
        run: |
          echo "KUBEBUILDER_ASSETS raw: $KUBEBUILDER_ASSETS"
          ASSETS="${KUBEBUILDER_ASSETS//\'/}"
          if [ -z "$ASSETS" ]; then
            echo "FAIL: KUBEBUILDER_ASSETS not set"
            exit 1
          fi
          for b in kube-apiserver etcd kubectl; do
            if [ ! -x "$ASSETS/$b" ]; then
              echo "FAIL: $ASSETS/$b missing or not executable"
              ls -la "$ASSETS" || true
              exit 1
            fi
          done
          echo "PASS"
