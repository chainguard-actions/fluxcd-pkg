name: Test specific setup-envtest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          envtest_version: release-0.21
          k8s_version: "1.32.x"
      - name: Assert setup-envtest installed into versioned tool cache dir
        run: |
          echo "VERSION env: $VERSION"
          if [ "$VERSION" != "release-0.21" ]; then
            echo "FAIL: expected VERSION=release-0.21"
            exit 1
          fi
          OS=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          BIN="$RUNNER_TOOL_CACHE/setup-envtest/release-0.21/$OS/$ARCH/setup-envtest"
          echo "expected binary: $BIN"
          if [ ! -x "$BIN" ]; then
            echo "FAIL: setup-envtest binary not found at $BIN"
            exit 1
          fi
          if [ "$(command -v setup-envtest)" != "$BIN" ]; then
            echo "FAIL: PATH resolves setup-envtest to $(command -v setup-envtest)"
            exit 1
          fi
          echo "PASS"
      - name: Assert KUBEBUILDER_ASSETS for 1.32
        run: |
          ASSETS="${KUBEBUILDER_ASSETS//\'/}"
          echo "assets: $ASSETS"
          if [ ! -x "$ASSETS/kube-apiserver" ] || [ ! -x "$ASSETS/etcd" ]; then
            echo "FAIL: envtest binaries missing"
            exit 1
          fi
          case "$ASSETS" in
            *1.32.*) ;;
            *) echo "FAIL: expected path to contain 1.32."; exit 1 ;;
          esac
          echo "PASS"
