name: Test latest version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert kubectl is installed
        run: |
          OUT="$(kubectl version --client -o json)"
          echo "$OUT"
          if ! echo "$OUT" | grep -qE '"gitVersion": *"v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected a semver gitVersion"
            exit 1
          fi
          case "$(which kubectl)" in
            "$RUNNER_TOOL_CACHE"/kubectl/v*) ;;
            *) echo "FAIL: kubectl not from tool cache: $(which kubectl)"; exit 1 ;;
          esac
          echo "PASS"
