name: Test second run uses cached binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: first
        uses: .
        with:
          version: v1.28.4
      - name: Record binary mtime
        run: |
          BIN="$(which kubectl)"
          echo "bin: $BIN"
          stat -c %Y "$BIN" > /tmp/kubectl-mtime
          echo "$BIN" > /tmp/kubectl-path
      - id: second
        uses: .
        with:
          version: v1.28.4
      - name: Assert binary reused and version correct
        run: |
          BIN="$(cat /tmp/kubectl-path)"
          BEFORE="$(cat /tmp/kubectl-mtime)"
          AFTER="$(stat -c %Y "$BIN")"
          echo "before: $BEFORE after: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: binary was re-downloaded"
            exit 1
          fi
          OUT="$(kubectl version --client -o json)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q '"gitVersion": *"v1.28.4"'; then
            echo "FAIL: expected gitVersion v1.28.4"
            exit 1
          fi
          echo "PASS"
