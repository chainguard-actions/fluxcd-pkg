name: Test cached reinstall
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: first
        uses: .
        with:
          version: 1.28.4
      - name: Record binary mtime
        run: |
          BIN="$(ls "$RUNNER_TOOL_CACHE"/kubectl/v1.28.4/linux/*/kubectl)"
          echo "bin: $BIN"
          stat -c %Y "$BIN" > /tmp/kubectl-mtime
      - id: second
        uses: .
        with:
          version: 1.28.4
      - name: Assert cached binary reused and works
        run: |
          BIN="$(ls "$RUNNER_TOOL_CACHE"/kubectl/v1.28.4/linux/*/kubectl)"
          NOW="$(stat -c %Y "$BIN")"
          echo "before: $(cat /tmp/kubectl-mtime) after: $NOW"
          if [ "$NOW" != "$(cat /tmp/kubectl-mtime)" ]; then
            echo "FAIL: binary was re-downloaded"
            exit 1
          fi
          OUT="$(kubectl version --client -o json)"
          echo "$OUT"
          echo "$OUT" | grep -q '"gitVersion": *"v1.28.4"' || { echo "FAIL: wrong version"; exit 1; }
          echo "PASS"
