name: Test latest version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert kubectl installed
        run: |
          which kubectl
          OUT="$(kubectl version --client 2>&1)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE "v1\.[0-9]+\.[0-9]+"; then
            echo "FAIL: expected a kubectl client version"
            exit 1
          fi
          echo "PASS"
