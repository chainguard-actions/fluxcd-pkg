name: Test default (latest) version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert some kubectl v1.x installed
        run: |
          which kubectl || { echo "FAIL: kubectl not on PATH"; exit 1; }
          OUT="$(kubectl version --client -o json)"
          echo "$OUT"
          if ! echo "$OUT" | grep -qE '"gitVersion": *"v1\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected a v1.x.y gitVersion"
            exit 1
          fi
          echo "PASS"
