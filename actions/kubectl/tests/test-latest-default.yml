name: Test latest version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert some kubectl version installed
        run: |
          OUT="$(kubectl version --client 2>&1)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE "Client Version: v[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "FAIL: expected a client version"
            exit 1
          fi
          echo "PASS"
