name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v3.9.0
      - name: Assert sops installed with expected version
        run: |
          which sops
          OUT="$(sops --version 2>&1 || true)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "3\.9\.0"; then
            echo "FAIL: expected sops 3.9.0"
            exit 1
          fi
          echo "PASS"
      - name: Assert installed into tool cache
        run: |
          P="$(command -v sops)"
          echo "path: $P"
          case "$P" in
            "$RUNNER_TOOL_CACHE"/sops/v3.9.0/linux/*/sops) echo "PASS" ;;
            *) echo "FAIL: unexpected install path"; exit 1 ;;
          esac
