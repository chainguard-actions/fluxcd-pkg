name: Test second run reuses cached binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: first
        uses: .
        with:
          version: 3.8.1
      - name: Record binary mtime
        run: |
          SOPS_PATH="$(command -v sops)"
          echo "sops path: $SOPS_PATH"
          stat -c %Y "$SOPS_PATH" > /tmp/sops-mtime
          cat /tmp/sops-mtime
      - id: second
        uses: .
        with:
          version: v3.8.1
      - name: Assert cached binary reused
        run: |
          SOPS_PATH="$(command -v sops)"
          echo "sops path: $SOPS_PATH"
          BEFORE="$(cat /tmp/sops-mtime)"
          AFTER="$(stat -c %Y "$SOPS_PATH")"
          echo "before: $BEFORE after: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: binary was re-downloaded instead of reused"
            exit 1
          fi
          if ! sops --version 2>&1 | grep -q "3.8.1"; then
            echo "FAIL: expected version 3.8.1"
            exit 1
          fi
          echo "PASS"
