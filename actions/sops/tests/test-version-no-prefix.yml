name: Test version without v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 3.8.1
      - name: Assert version normalized and installed
        run: |
          P="$(command -v sops)"
          echo "path: $P"
          case "$P" in
            "$RUNNER_TOOL_CACHE"/sops/v3.8.1/*) echo "path ok" ;;
            *) echo "FAIL: expected path under sops/v3.8.1"; exit 1 ;;
          esac
          OUT="$(sops --version 2>&1 || true)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "3\.8\.1"; then
            echo "FAIL: expected sops 3.8.1"
            exit 1
          fi
          echo "PASS"
