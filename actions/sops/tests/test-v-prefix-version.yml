name: Test version with v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v3.9.0
      - name: Assert sops v3.9.0 installed
        run: |
          SOPS_PATH="$(command -v sops || true)"
          echo "sops path: $SOPS_PATH"
          case "$SOPS_PATH" in
            *"/sops/v3.9.0/"*) ;;
            *) echo "FAIL: sops not from tool cache dir for v3.9.0 (no double v prefix expected)"; exit 1 ;;
          esac
          if [ ! -x "$SOPS_PATH" ]; then
            echo "FAIL: sops binary not executable"
            exit 1
          fi
          OUT="$(sops --version 2>&1)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -q "3.9.0"; then
            echo "FAIL: expected version 3.9.0"
            exit 1
          fi
          echo "PASS"
