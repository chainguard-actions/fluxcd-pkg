name: Test latest version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert sops installed
        run: |
          P="$(command -v sops || true)"
          echo "path: $P"
          if [ -z "$P" ]; then
            echo "FAIL: sops not on PATH"
            exit 1
          fi
          case "$P" in
            "$RUNNER_TOOL_CACHE"/sops/v*/linux/*/sops) echo "path ok" ;;
            *) echo "FAIL: unexpected install path"; exit 1 ;;
          esac
          OUT="$(sops --version 2>&1 || true)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -qE "sops [0-9]+\.[0-9]+\.[0-9]+"; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          echo "PASS"
