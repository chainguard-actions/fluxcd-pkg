name: Test latest version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert some sops version installed
        run: |
          SOPS_PATH="$(command -v sops || true)"
          echo "sops path: $SOPS_PATH"
          if [ -z "$SOPS_PATH" ]; then
            echo "FAIL: sops not on PATH"
            exit 1
          fi
          case "$SOPS_PATH" in
            *"/sops/v"[0-9]*) ;;
            *) echo "FAIL: sops not installed under versioned tool cache dir"; exit 1 ;;
          esac
          OUT="$(sops --version 2>&1)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -qE "[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "FAIL: no semver in version output"
            exit 1
          fi
          echo "PASS"
