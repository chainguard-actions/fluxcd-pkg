name: Test latest version (no input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert kubeconform installed
        run: |
          ACTUAL="$(kubeconform -v)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected a semver version string"
            exit 1
          fi
          echo "PASS"
