name: Test cached reinstall
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: first
        uses: .
        with:
          version: v0.6.7
      - name: Record binary mtime
        run: |
          BIN="$(command -v kubeconform)"
          echo "bin: $BIN"
          stat -c %Y "$BIN" > /tmp/kc-mtime
          echo "$BIN" > /tmp/kc-path
      - id: second
        uses: .
        with:
          version: v0.6.7
      - name: Assert cached binary reused
        run: |
          BIN="$(cat /tmp/kc-path)"
          BEFORE="$(cat /tmp/kc-mtime)"
          AFTER="$(stat -c %Y "$BIN")"
          echo "before: $BEFORE after: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: binary was re-extracted instead of reused"
            exit 1
          fi
          ACTUAL="$(kubeconform -v)"
          echo "version: $ACTUAL"
          if [ "$ACTUAL" != "v0.6.7" ]; then
            echo "FAIL: expected v0.6.7"
            exit 1
          fi
          echo "PASS"
