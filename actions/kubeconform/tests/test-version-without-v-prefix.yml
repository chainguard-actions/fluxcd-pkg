name: Test version without v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 0.6.4
      - name: Assert version normalized and installed
        run: |
          ACTUAL="$(kubeconform -v 2>&1)"
          echo "actual: $ACTUAL"
          echo "path: $(which kubeconform)"
          if ! echo "$ACTUAL" | grep -q "0.6.4"; then
            echo "FAIL: expected version 0.6.4"
            exit 1
          fi
          case "$(which kubeconform)" in
            *kubeconform/v0.6.4/*) echo "PASS" ;;
            *) echo "FAIL: expected v-prefixed tool dir"; exit 1 ;;
          esac
