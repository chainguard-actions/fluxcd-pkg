name: Test version without v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 0.6.4
      - name: Assert v prefix was added and version installed
        run: |
          ACTUAL="$(kubeconform -v)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "0.6.4"; then
            echo "FAIL: expected version 0.6.4"
            exit 1
          fi
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          [ "$ARCH" = "x64" ] && ARCH=amd64
          if [ ! -x "${RUNNER_TOOL_CACHE}/kubeconform/v0.6.4/linux/${ARCH}/kubeconform" ]; then
            echo "FAIL: expected binary under v0.6.4 directory"
            exit 1
          fi
          echo "PASS"
