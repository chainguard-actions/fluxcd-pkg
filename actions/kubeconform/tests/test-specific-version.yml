name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.6.7
      - name: Assert kubeconform installed at requested version
        run: |
          which kubeconform || { echo "FAIL: kubeconform not on PATH"; exit 1; }
          ACTUAL="$(kubeconform -v)"
          echo "actual: $ACTUAL"
          if [[ "$ACTUAL" != *"0.6.7"* ]]; then
            echo "FAIL: expected version 0.6.7"
            exit 1
          fi
          EXPECTED_DIR="${RUNNER_TOOL_CACHE}/kubeconform/v0.6.7/linux"
          if ! ls "$EXPECTED_DIR"/*/kubeconform >/dev/null 2>&1; then
            echo "FAIL: binary not found in tool cache $EXPECTED_DIR"
            exit 1
          fi
          echo "PASS"
