name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.6.7
      - name: Assert kubeconform installed with correct version
        run: |
          which kubeconform || { echo "FAIL: kubeconform not on PATH"; exit 1; }
          ACTUAL="$(kubeconform -v 2>&1)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "0.6.7"; then
            echo "FAIL: expected version 0.6.7"
            exit 1
          fi
          case "$(which kubeconform)" in
            *kubeconform/v0.6.7/*) echo "PASS: installed into tool cache" ;;
            *) echo "FAIL: unexpected install path $(which kubeconform)"; exit 1 ;;
          esac
      - name: Assert it validates a manifest
        run: |
          cat > /tmp/cm.yaml <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test
          data:
            key: value
          EOF
          kubeconform -summary /tmp/cm.yaml
          echo "PASS"
