name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.6.7
      - name: Assert kubeconform installed with requested version
        run: |
          which kubeconform || { echo "FAIL: kubeconform not on PATH"; exit 1; }
          ACTUAL="$(kubeconform -v)"
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "0.6.7"; then
            echo "FAIL: expected version 0.6.7"
            exit 1
          fi
          echo "PASS"
      - name: Assert tool cache location
        run: |
          ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
          [ "$ARCH" = "x64" ] && ARCH=amd64
          F="${RUNNER_TOOL_CACHE}/kubeconform/v0.6.7/linux/${ARCH}/kubeconform"
          echo "checking $F"
          if [ ! -x "$F" ]; then
            echo "FAIL: binary not found in tool cache"
            exit 1
          fi
          echo "PASS"
      - name: Assert kubeconform validates a manifest
        run: |
          cat > /tmp/cm.yaml <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test
          data:
            key: value
          EOF
          kubeconform -summary /tmp/cm.yaml || { echo "FAIL: validation failed"; exit 1; }
          echo "PASS"
