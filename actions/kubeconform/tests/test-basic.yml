name: Test basic usage with explicit version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.6.7
      - name: Assert kubeconform installed with correct version
        run: |
          set -e
          echo "which: $(command -v kubeconform || true)"
          if ! command -v kubeconform >/dev/null 2>&1; then
            echo "FAIL: kubeconform not on PATH"
            exit 1
          fi
          ACTUAL="$(kubeconform -v)"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "v0.6.7" ]; then
            echo "FAIL: expected 'v0.6.7'"
            exit 1
          fi
          case "$(command -v kubeconform)" in
            *"/kubeconform/v0.6.7/"*) ;;
            *) echo "FAIL: kubeconform not installed in tool cache dir"; exit 1 ;;
          esac
          echo "PASS"
